---

python_pip_packages:
  - python3-pip
  - python3-firewall
  - python3-docker

docker_package_conflicts:
  - podman-docker

default_docker_dependencies:
  - python311-docker
  - python311-firewall

containerd_package_name: containerd
skip_containerd: true
skip_docker_py: true
skip_cli: true
docker_package_name: docker
docker_buildx_repo: https://download.opensuse.org/repositories/home:regataos/15.6/home:regataos.repo
docker_service_override: |
  [Unit]
  After=network-online.target
  Wants=network-online.target